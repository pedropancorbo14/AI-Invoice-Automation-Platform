name: CI

# Se ejecuta en cada push a cualquier rama: main y las ramas de trabajo
# (el resultado aparece también en sus pull requests).
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint + Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip, gd, bcmath
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoices_test
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U invoices"
          --health-interval 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: invoices_test
      DB_USERNAME: invoices
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip, gd, bcmath
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite en memoria; aquí forzamos PostgreSQL de verdad.
      - name: Pest
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: invoices_test

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose.yaml
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: docker build -t invoices-app:ci .
      - name: Extensiones PHP disponibles
        run: docker run --rm invoices-app:ci php -m | grep -E 'pdo_pgsql|redis|intl|pcntl'
      - name: Conversor HEIC disponible
        run: docker run --rm invoices-app:ci sh -c 'command -v heif-convert'
