name: CI

# Se ejecuta en cada push a cualquier rama: main y las ramas de trabajo
# (el resultado aparece también en sus pull requests).
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint + Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip, gd, bcmath
          coverage: none

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoices_test
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U invoices"
          --health-interval 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: invoices_test
      DB_USERNAME: invoices
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip, gd, bcmath
          coverage: none

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Para los tests del lector de QR de VERI*FACTU.
      - name: zbarimg y pdftoppm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zbar-tools poppler-utils

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite en memoria; aquí forzamos PostgreSQL de verdad.
      - name: Pest
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: invoices_test

  frontend:
    name: Panel (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar compose.yaml
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validar compose.prod.yaml
        run: APP_DOMAIN=demo.test DB_PASSWORD=x DB_DATABASE=invoices DB_USERNAME=invoices docker compose -f compose.prod.yaml config --quiet
      - name: Imagen de desarrollo
        run: docker build --target dev -t invoices-app:ci .
      - name: Imágenes de producción (app y web)
        run: |
          docker build --target prod -t facturas-ia:prod .
          docker build --target web -t facturas-ia:web .
      - name: La imagen de producción arranca Laravel y trae el panel
        run: |
          docker run --rm -e APP_KEY=base64:$(openssl rand -base64 32) -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: facturas-ia:prod php artisan --version
          docker run --rm --entrypoint sh facturas-ia:prod -c 'test -f public/build/manifest.json'
          docker run --rm facturas-ia:web sh -c 'test -f /var/www/html/public/build/manifest.json'
      - name: Extensiones PHP disponibles
        run: docker run --rm invoices-app:ci php -m | grep -E 'pdo_pgsql|redis|intl|pcntl'
      - name: Conversor HEIC disponible
        run: docker run --rm invoices-app:ci sh -c 'command -v heif-convert'
      - name: Lector de QR disponible
        run: docker run --rm invoices-app:ci sh -c 'command -v zbarimg && command -v pdftoppm'
