# Producción en un solo servidor: docker compose -f compose.prod.yaml up -d --build
# Guía: docs/despliegue.md
x-app: &app
  build:
    context: .
    target: prod
  image: facturas-ia:prod
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  web:
    build:
      context: .
      target: web
    image: facturas-ia:web
    restart: unless-stopped
    depends_on:
      - app

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN en .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Grafana (solo para ti): perfil "grafana", ver docs/grafana.md.
  #   docker compose -f compose.prod.yaml --profile grafana up -d
  # Escucha solo en 127.0.0.1: se entra con un túnel SSH, nunca desde internet.
  grafana-db:
    image: postgres:17-alpine
    profiles: [grafana]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - ./docker/grafana/readonly-user.sql:/readonly-user.sql:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$$GRAFANA_DB_PASSWORD" ] || [ -z "$$GRAFANA_ADMIN_PASSWORD" ]; then
          echo "Define GRAFANA_DB_PASSWORD y GRAFANA_ADMIN_PASSWORD en .env (docs/grafana.md)." >&2
          exit 1
        fi
        psql -q -v ON_ERROR_STOP=1 -v grafana_password="$$GRAFANA_DB_PASSWORD" -f /readonly-user.sql
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [grafana]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/uso.json
      GRAFANA_DB_NAME: ${DB_DATABASE}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      grafana-db:
        condition: service_completed_successfully

volumes:
  storage:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  grafana-data:
