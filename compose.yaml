# Entorno de desarrollo: app (PHP-FPM) + Nginx + PostgreSQL + Redis + Horizon.
x-app: &app
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: invoices-app:dev
  volumes:
    - .:/var/www/html
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  horizon:
    <<: *app
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  # Compila el panel (Vue): docker compose run --rm assets
  assets:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run build"
    profiles: [tools]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-invoices}
      POSTGRES_USER: ${DB_USERNAME:-invoices}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-invoices} -d ${DB_DATABASE:-invoices}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Bandeja de correo local para ver los emails que manda la app: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

  # Usuario de solo lectura para Grafana. Se ejecuta en cada arranque y termina.
  grafana-db:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE:-invoices}
      PGUSER: ${DB_USERNAME:-invoices}
      PGPASSWORD: ${DB_PASSWORD:-secret}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - ./docker/grafana/readonly-user.sql:/readonly-user.sql:ro
    command: sh -c 'psql -q -v ON_ERROR_STOP=1 -v grafana_password="$$GRAFANA_DB_PASSWORD" -f /readonly-user.sql'
    depends_on:
      postgres:
        condition: service_healthy

  # Uso y costes de todas las cuentas: http://localhost:3000 (docs/grafana.md)
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "${FORWARD_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/uso.json
      GRAFANA_DB_NAME: ${DB_DATABASE:-invoices}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      grafana-db:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  grafana-data:
